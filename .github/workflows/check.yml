name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SwiftLint 0.65.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools/swiftlint
          gh release download 0.65.1 --repo realm/SwiftLint --pattern portable_swiftlint.zip --dir .tools
          ditto -xk .tools/portable_swiftlint.zip .tools/swiftlint
          echo "$GITHUB_WORKSPACE/.tools/swiftlint" >> "$GITHUB_PATH"
      - run: scripts/bootstrap
      - run: scripts/check
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            range=HEAD
          else
            range="$BASE_SHA..HEAD"
          fi
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/commit-message"
            scripts/check-commit-message "$RUNNER_TEMP/commit-message"
          done < <(git rev-list "$range")
